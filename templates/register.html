{% extends "base.html" %}{% block title %}Sign up{% endblock %}
{% block body %}<div class="card" style="max-width:360px;margin:40px auto"><h2 style="margin-top:0">Create account</h2>
<form method="post"><label>Name</label><input name="name" required><label>Phone (10 digits)</label><input name="phone" inputmode="numeric" maxlength="10" required>
<label>Email (optional)</label><input name="email" type="email"><label>Password (6+ chars)</label><input name="password" type="password" minlength="6" required><br><br>
<button style="width:100%">Sign up</button></form><p class="mut">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>{% endblock %}
