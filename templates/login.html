{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block body %}<div class="card" style="max-width:360px;margin:40px auto"><h2 style="margin-top:0">Login</h2>
<form method="post"><label>Phone</label><input name="phone" inputmode="numeric" maxlength="10" required autofocus>
<label>Password</label><input name="password" type="password" required><br><br><button style="width:100%">Login</button></form>
<p class="mut">New here? <a href="{{ url_for('register', next=request.args.get('next')) }}">Create an account</a></p></div>{% endblock %}
